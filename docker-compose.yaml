version: '3.8'

services:
  mysql:
    image: mysql:8.0.33
    container_name: agent-network-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: deagentnet
      MYSQL_USER: deagentnet
      MYSQL_PASSWORD: passw0rd
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "deagentnet", "-ppassw0rd"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  event-handler:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: agent-network-event-handler
    env_file:
      - ./server/.env
    environment:
      DB_URI: mysql://deagentnet:passw0rd@mysql:3306/deagentnet
    command: npm run event-handler:dev
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  indexer-api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: agent-network-indexer-api
    ports:
      - "4000:4000"
    env_file:
      - ./server/.env
    environment:
      DB_URI: mysql://deagentnet:passw0rd@mysql:3306/deagentnet
    command: npm run api:dev
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: agent-network-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: mysql://deagentnet:passw0rd@mysql:3306/deagentnet
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: agent-network-client
    ports:
      - "5173:3000"
    depends_on:
      - indexer-api
    restart: unless-stopped

volumes:
  mysql-data:
