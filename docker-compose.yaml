services:
  mysql:
    image: mysql:8.0.33
    container_name: agent-network-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-deagentnet}
      MYSQL_USER: ${MYSQL_USER:-deagentnet}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-passw0rd}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER:-deagentnet}", "-p${MYSQL_PASSWORD:-passw0rd}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mcp:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: agent-network-mcp
    ports:
      - "4000:4000"
    env_file:
      - ./server/.env
    environment:
      DB_URI: mysql://${MYSQL_USER:-deagentnet}:${MYSQL_PASSWORD:-passw0rd}@mysql:3306/${MYSQL_DATABASE:-deagentnet}
      PORT: "4000"
      MCP_SERVER_USE_SSE: "true"
    depends_on:
      mysql:
        condition: service_healthy
    command: npm run mcp:dev
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: agent-network-backend
    ports:
      - "8080:3000"
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-deagentnet}:${MYSQL_PASSWORD:-passw0rd}@mysql:3306/${MYSQL_DATABASE:-deagentnet}
      PORT: "3000"
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-default_internal_key}
    env_file:
      - ./backend/.env
    volumes:
      - ./keys:/keys
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  event-handler:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: agent-network-event-handler
    env_file:
      - ./server/.env
    environment:
      DB_URI: mysql://${MYSQL_USER:-deagentnet}:${MYSQL_PASSWORD:-passw0rd}@mysql:3306/${MYSQL_DATABASE:-deagentnet}
      RUST_BACKEND_URL: http://backend:3000
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-default_internal_key}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - API_URL=http://backend:3000
        - NEXT_PUBLIC_API_URL=http://backend:3000
    container_name: agent-network-client
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:3000
      API_URL: http://backend:3000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql-data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16

