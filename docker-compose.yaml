services:
  mysql:
    image: mysql:8.0.33
    container_name: agent-network-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-deagentnet}
      MYSQL_USER: ${MYSQL_USER:-deagentnet}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER:-deagentnet}", "-p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mcp:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: agent-network-mcp
    ports:
      - "4000:4000"
    env_file:
      - ./server/.env
    environment:
      DB_URI: mysql://${MYSQL_USER:-deagentnet}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-deagentnet}
      PORT: "4000"
      MCP_SERVER_USE_SSE: "true"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      mysql:
        condition: service_healthy
    command: npm run mcp:dev
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: agent-network-backend
    ports:
      - "8080:3000"
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-deagentnet}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-deagentnet}
      PORT: "3000"
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY must be set}
    env_file:
      - ./backend/.env
    volumes:
      - ./keys:/keys
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  event-handler:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: agent-network-event-handler
    env_file:
      - ./server/.env
    environment:
      DB_URI: mysql://${MYSQL_USER:-deagentnet}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-deagentnet}
      RUST_BACKEND_URL: http://backend:3000
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY must be set}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - API_URL=http://backend:3000
        - NEXT_PUBLIC_API_URL=http://backend:3000
    container_name: agent-network-client
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:3000
      API_URL: http://backend:3000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  validator-1:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: agent-network-validator-1
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-deagentnet}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-deagentnet}
      PORT: "3001"
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY must be set}
      VALIDATOR_NODE_ID: "validator-1"
      VALIDATOR_LLM_PROVIDER: ${VALIDATOR_1_LLM_PROVIDER:-openai}
      VALIDATOR_LLM_MODEL: ${VALIDATOR_1_LLM_MODEL:-gpt-4o}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  validator-2:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: agent-network-validator-2
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-deagentnet}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-deagentnet}
      PORT: "3002"
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY must be set}
      VALIDATOR_NODE_ID: "validator-2"
      VALIDATOR_LLM_PROVIDER: ${VALIDATOR_2_LLM_PROVIDER:-claude}
      VALIDATOR_LLM_MODEL: ${VALIDATOR_2_LLM_MODEL:-claude-3-5-sonnet-20241022}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  validator-3:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: agent-network-validator-3
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-deagentnet}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-deagentnet}
      PORT: "3003"
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY must be set}
      VALIDATOR_NODE_ID: "validator-3"
      VALIDATOR_LLM_PROVIDER: ${VALIDATOR_3_LLM_PROVIDER:-fireworks}
      VALIDATOR_LLM_MODEL: ${VALIDATOR_3_LLM_MODEL:-accounts/fireworks/models/llama-v3p1-70b-instruct}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16


