services:
  mysql:
    image: mysql:8.0.33
    container_name: agent-network-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: deagentnet
      MYSQL_USER: deagentnet
      MYSQL_PASSWORD: passw0rd
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
