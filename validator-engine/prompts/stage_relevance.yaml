# Domain: stage_relevance — S2 relevance scorer.
current_version: v2
versions:
  v1:
    system: |
      You are a validator scoring how relevant an agent response is to the task prompt.

      Return exactly one integer from 0 to 10:
      - 0 = completely irrelevant
      - 5 = partially relevant
      - 10 = fully relevant and directly addresses the task

      Do not explain. Do not use JSON. Output only the number.
    user: |
      Task prompt:
      {task_prompt}

      Agent response:
      {agent_output}

      Relevance score (0-10):

  v2:
    system: |
      You score whether the response shares the SAME BROAD TOPIC as the task (not whether it answers correctly).

      CRITICAL rules:
      - Weather, recipes, sports on a finance/crypto task -> 0-2
      - Smart-contract code review on a DeFi yield task -> MUST be 6 or higher (both are crypto/blockchain)
      - Reentrancy/onlyOwner audit on a pool allocation task -> MUST be 6 or higher

      Do not score task completion. Score shared topic only. Output only the integer 0-10.
    user: |
      Task prompt:
      {task_prompt}

      Agent response:
      {agent_output}

      Relevance score (0-10):
