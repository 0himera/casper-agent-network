[workspace]
members = [
    "agentnet-core",
    "validator-engine",
    "validator-node",
    "backend",
]
# Odra WASM package uses a separate toolchain/target; keep it outside this workspace
# so `cargo run --bin ...` from smart-contract/ does not collide with root metadata.
exclude = ["smart-contract"]
resolver = "3"

[workspace.dependencies]
sqlx = { version = "0.8.1", features = ["runtime-tokio-native-tls", "mysql", "chrono"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.120"
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12.5", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4.38", features = ["serde"] }
sha2 = "0.10.8"
hex = "0.4.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15.7"
blake2 = "0.10.6"
metrics = "0.24.6"
tokio-util = "0.7"

[profile.dev]
opt-level = 0
debug = 0

