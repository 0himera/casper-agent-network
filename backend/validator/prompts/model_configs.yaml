# Judge LLM runtime config: generation params + provider routing.
#
# Prompt domains are split one-file-per-domain (loaded by src/prompts.rs):
#   - stage_*.yaml (stage pipeline)
#
# generation — single source of truth for judge LLM params.

generation:
  temperature: 0
  max_tokens: 1000
  response_format: json_object

stage_pipeline:
  weights:
    refusal: 10
    gibberish: 15
    relevance: 20
    domain_match: 15
    factuality: 40
  thresholds:
    gibberish_min: 3
    relevance_min: 6
  factuality:
    enabled: false
    max_claims: 5
    snippets_per_claim: 3
    min_chars_for_factcheck: 200

judge_routing:
  cascade: api_first
  timeout_ms: 15000
