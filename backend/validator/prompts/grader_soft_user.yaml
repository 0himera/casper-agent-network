# Domain: grader_soft_user — F3 soft-label grader user template + few-shot exemplars.
# Variable substitution: {variable} (LangChain-style templates).
# current_version — active version; older versions kept for A/B baseline.

current_version: v2
versions:
  v1:
    user: |
      <rubric>
      {rubric}
      </rubric>

      <fixture>
      {fixture}
      </fixture>

      <task_prompt>
      {task_prompt}
      </task_prompt>

      <agent_output>
      {agent_output}
      </agent_output>
    input_variables:
      - rubric
      - fixture
      - task_prompt
      - agent_output
    few_shot: []

  v2:
    user: |
      {few_shot_block}

      <rubric>
      {rubric}
      </rubric>

      <fixture>
      {fixture}
      </fixture>

      <task_prompt>
      {task_prompt}
      </task_prompt>

      <agent_output>
      {agent_output}
      </agent_output>
    input_variables:
      - few_shot_block
      - rubric
      - fixture
      - task_prompt
      - agent_output
    few_shot:
      - id: pool_selection_strong
        skills: [defi_yield_routing]
        criterion_ids: [pool_selection]
        task_prompt: "Allocate 10,000 CSPR across Casper liquidity pools minimizing impermanent loss risk."
        agent_output: "Allocate 4,000 CSPR to cspr-usdt (8.2% APY, high TVL), 3,500 CSPR to cspr-eth (6.1% APY, moderate IL), and 2,500 CSPR to cspr-wbtc (11.4% APY, higher IL risk). Total: 10,000 CSPR. IL analysis shows cspr-usdt lowest volatility exposure; cspr-wbtc higher yield but higher IL risk."
        fixture_excerpt: '{"amount_cspr": 10000, "pools": [{"id": "cspr-usdt", "apy": 0.082}, {"id": "cspr-eth", "apy": 0.061}, {"id": "cspr-wbtc", "apy": 0.114}]}'
        expected_response:
          criteria:
            - id: pool_selection
              label: strong
              gap: null
          explanation: "Clear trade-offs across APY, TVL, and IL for each pool."

      - id: pool_selection_partial
        skills: [defi_yield_routing]
        criterion_ids: [pool_selection]
        task_prompt: "Allocate 10,000 CSPR across Casper liquidity pools."
        agent_output: "Split evenly: 3,333 CSPR each to cspr-usdt, cspr-eth, and cspr-wbtc. Total 10,000 CSPR."
        fixture_excerpt: '{"amount_cspr": 10000, "pools": [{"id": "cspr-usdt", "apy": 0.082, "tvl_usd": 1200000}, {"id": "cspr-wbtc", "apy": 0.114, "tvl_usd": 250000}]}'
        expected_response:
          criteria:
            - id: pool_selection
              label: partial
              gap: "Even split ignores APY, liquidity depth, and IL trade-offs."
          explanation: "Allocation sums correctly but pool selection reasoning is weak."

      - id: pool_selection_missing
        skills: [defi_yield_routing]
        criterion_ids: [pool_selection]
        task_prompt: "Allocate 10,000 CSPR across Casper liquidity pools."
        agent_output: "Put all 10,000 CSPR in cspr-wbtc because it has the highest APY at 11.4%."
        fixture_excerpt: '{"amount_cspr": 10000, "pools": [{"id": "cspr-wbtc", "apy": 0.114, "tvl_usd": 250000}]}'
        expected_response:
          criteria:
            - id: pool_selection
              label: missing
              gap: "Single-pool max-APY choice ignores diversification, IL, and liquidity constraints."
          explanation: "No meaningful pool selection logic beyond chasing highest APY."

      - id: mitigation_steps_strong
        skills: [defi_protocol_risk]
        criterion_ids: [mitigation_steps]
        task_prompt: "Analyze protocol risk based on recent transaction revert patterns."
        agent_output: "Revert rate is 15% over the last 6 hours, exceeding the 10% anomaly threshold. Classification: High Risk. Recommended mitigation: pause new deposits, increase monitoring frequency, alert users to withdraw idle funds, and prepare emergency circuit breaker activation."
        fixture_excerpt: '{"revert_rate": 0.15, "anomaly_threshold": 0.10, "recent_spike": true}'
        expected_response:
          criteria:
            - id: mitigation_steps
              label: strong
              gap: null
          explanation: "Specific, actionable mitigation steps tied to elevated revert rate."

      - id: mitigation_steps_partial
        skills: [defi_protocol_risk]
        criterion_ids: [mitigation_steps]
        task_prompt: "Analyze protocol risk."
        agent_output: "Revert rate is 15%, above threshold. High Risk. Monitor the situation and stay alert."
        fixture_excerpt: '{"revert_rate": 0.15, "anomaly_threshold": 0.10}'
        expected_response:
          criteria:
            - id: mitigation_steps
              label: partial
              gap: "Mitigation is generic monitoring only; lacks concrete loss-prevention actions."
          explanation: "Risk classification present but mitigation steps are vague."

      - id: mitigation_steps_missing
        skills: [defi_protocol_risk]
        criterion_ids: [mitigation_steps]
        task_prompt: "Analyze protocol risk."
        agent_output: "Revert rate is 15% over 6 hours. Classification: High Risk."
        fixture_excerpt: '{"revert_rate": 0.15, "anomaly_threshold": 0.10}'
        expected_response:
          criteria:
            - id: mitigation_steps
              label: missing
              gap: "No mitigation or loss-prevention steps provided."
          explanation: "Identifies risk but omits remediation entirely."

      - id: remediation_plan_strong
        skills: [rwa_compliance]
        criterion_ids: [remediation_plan]
        task_prompt: "Assess issuer compliance risk and recommend collateral factor adjustment."
        agent_output: "SEC inquiry (verified, high severity) is a real threat requiring collateral reduction. Social media default claims are unverified FUD. Recommendation: reduce collateral factor from 0.85 to 0.70. Remediation: monitor SEC proceedings, require additional disclosures, set 30-day review checkpoint."
        fixture_excerpt: '{"current_collateral_factor": 0.85, "news_items": [{"headline": "SEC inquiry", "verified": true, "severity": "high"}]}'
        expected_response:
          criteria:
            - id: remediation_plan
              label: strong
              gap: null
          explanation: "Complete remediation plan with monitoring, disclosures, and review timeline."

      - id: remediation_plan_partial
        skills: [rwa_compliance]
        criterion_ids: [remediation_plan]
        task_prompt: "Assess compliance risk."
        agent_output: "SEC inquiry is a real threat. Reduce collateral factor to 0.70. Review issuer documents periodically."
        fixture_excerpt: '{"current_collateral_factor": 0.85}'
        expected_response:
          criteria:
            - id: remediation_plan
              label: partial
              gap: "Remediation mentions document review but lacks concrete steps, owners, or timelines."
          explanation: "Collateral adjustment reasoned but remediation plan is thin."

      - id: remediation_plan_missing
        skills: [rwa_compliance]
        criterion_ids: [remediation_plan]
        task_prompt: "Assess compliance risk."
        agent_output: "SEC inquiry is verified high severity. Reduce collateral factor from 0.85 to 0.70."
        fixture_excerpt: '{"current_collateral_factor": 0.85}'
        expected_response:
          criteria:
            - id: remediation_plan
              label: missing
              gap: "No remediation plan for ongoing compliance risks."
          explanation: "Collateral decision without remediation steps."
