[package]
name = "validator-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.120"
serde_yaml = "0.9.34"
dotenvy = "0.15.7"
tokio = { version = "1.38", features = ["macros", "rt", "rt-multi-thread", "time"] }
reqwest = { version = "0.12.5", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1.83"

[dev-dependencies]
tokio = { version = "1.38", features = ["macros", "rt", "time"] }
